services:
  api:
    image: ${ECR_REGISTRY:-381492049589.dkr.ecr.us-east-1.amazonaws.com}/core/${ENV_NAME:-prod}/api:${IMAGE_TAG:-latest}
    build:
      context: ../../
      dockerfile: stack/api/Dockerfile
    container_name: biz-tool-api
    hostname: biz-tool-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV_NAME=${ENV_NAME:-prod}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - POSTGRES_TASK_USER=${POSTGRES_TASK_USER}
      - POSTGRES_TASK_PW=${POSTGRES_TASK_PW}
      - POSTGRES_TASK_FQDN=${POSTGRES_TASK_FQDN:-biz-tool-postgres}
      - POSTGRES_TASK_PORT=${POSTGRES_TASK_PORT:-5432}
      - POSTGRES_TASK_DB_NAME=${POSTGRES_TASK_DB_NAME:-biztool}
      - TASK_BUCKET=${TASK_BUCKET}
      - DB_ENABLED=${DB_ENABLED:-1}
      - S3_ENABLED=${S3_ENABLED:-1}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://districtsolutions.ai,https://kbaas.districtsolutions.ai,https://aisoc.districtsolutions.ai}
      # SOC database (for SOC API routes)
      - SOC_DATABASE_URL=${SOC_DATABASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ${CORE_DIR:-/opt/ds/core}/core:/app/core:ro
    networks:
      - core-net
    extra_hosts:
      - host.docker.internal:host-gateway

networks:
  core-net:
    external: true
