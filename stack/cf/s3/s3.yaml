AWSTemplateFormatVersion: "2010-09-09"
Description: S3 bucket for task data - manifest.json files stored at s3://bucket/tasks/{task-uuid}/manifest.json

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

Resources:
  TaskDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "biz-tool-${Environment}-task-data-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldVersionsToIA
            Status: Enabled
            NoncurrentVersionTransitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment

  TaskDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TaskDataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEC2RoleAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
            Resource:
              - !Sub "${TaskDataBucket.Arn}"
              - !Sub "${TaskDataBucket.Arn}/*"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${TaskDataBucket.Arn}"
              - !Sub "${TaskDataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  TaskDataBucketName:
    Description: Name of the task data S3 bucket
    Value: !Ref TaskDataBucket

  TaskDataBucketArn:
    Description: ARN of the task data S3 bucket
    Value: !GetAtt TaskDataBucket.Arn

  TaskManifestPathPattern:
    Description: Pattern for task manifest files
    Value: !Sub "s3://${TaskDataBucket}/tasks/{task-uuid}/manifest.json"
