AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation template to launch an Amazon Linux 2023 EC2 instance

Parameters:
  Region:
    Description: AWS Region name
    Type: String
    Default: us-east-1

  InstanceName:
    Type: String
    Description: The display name for the EC2 instance in the console.

  EC2Type:
    Description: EC2 instance type
    Type: String
    Default: t3.medium

  VPCID:
    Type: AWS::EC2::VPC::Id
    Description: The VPC to launch the instance in.
    Default: vpc-0dd28884da7e4d4eb
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    # Prerequisites for public access:
    # 1. Subnet must have "Auto-assign public IPv4 address" enabled (MapPublicIpOnLaunch: true)
    # 2. Subnet's route table must have a route: 0.0.0.0/0 -> Internet Gateway (IGW)
    Description: The public subnet to launch the instance in.
    Default: subnet-0531a7a14eef69db2

  IsPublic:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Set to true to assign a public IP address.

  IngressCIDR:
    Type: String
    Description: The CIDR block allowed for HTTP/HTTPS/SSH access.
    Default: 96.231.57.192/32

  IngressCIDR1:
    Type: String
    Description: The CIDR block allowed for HTTP/HTTPS/SSH access.
    Default: 71.56.174.247/32

  PostgresCIDR:
    Type: String
    Description: CIDR allowed for direct Postgres (5432) access. Tightly scope to admin IPs only.
    Default: 96.231.57.192/32

  PostgresCIDR1:
    Type: String
    Description: Additional CIDR allowed for direct Postgres (5432) access.
    Default: 71.56.174.247/32

Resources:
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${Region}-ssm-profile"
      Path: "/"
      Roles:
        - ec2-ssm-role
  # EC2InstanceProfile - end

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "biz-tool-host-sg"
      GroupDescription: Allow HTTP, HTTPS, and SSH from my IP
      VpcId: !Ref VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref IngressCIDR
          Description: SSH
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref IngressCIDR
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref IngressCIDR
          Description: HTTPS
        - IpProtocol: "-1"
          CidrIp: !Ref IngressCIDR1
          Description: All traffic
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref PostgresCIDR
          Description: Postgres direct access
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref PostgresCIDR1
          Description: Postgres direct access
      Tags:
        - Key: Name
          Value: !Sub "biz-tool-host-sg"

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref EC2Type
      IamInstanceProfile: !Ref EC2InstanceProfile
      ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", UseAMID]
      Tags:
        - Key: Name
          Value: !Ref InstanceName
        - Key: region
          Value: !Ref Region
      NetworkInterfaces:
        - AssociatePublicIpAddress: !If [IsPublicCondition, true, false]
          DeviceIndex: 0
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref SecurityGroup
      BlockDeviceMappings:
        - DeviceName: "/dev/xvda"
          Ebs:
            VolumeType: "gp3"
            VolumeSize: "50"
            Iops: 3000
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -x
          echo "starting init" > /tmp/._cloud_init.log

          # system update
          dnf update -y >> /tmp/._cloud_init.log 2>&1

          # install base utils
          dnf install -y wget unzip git htop >> /tmp/._cloud_init.log 2>&1

          # install docker
          echo "installing docker" >> /tmp/._cloud_init.log
          dnf install -y docker >> /tmp/._cloud_init.log 2>&1
          systemctl enable docker >> /tmp/._cloud_init.log 2>&1
          systemctl start docker >> /tmp/._cloud_init.log 2>&1
          usermod -aG docker ec2-user >> /tmp/._cloud_init.log 2>&1
          docker ps -a >> /tmp/._cloud_init.log 2>&1
          echo "docker installed" >> /tmp/._cloud_init.log

          # install nginx
          echo "installing nginx" >> /tmp/._cloud_init.log
          dnf install -y nginx >> /tmp/._cloud_init.log 2>&1
          systemctl enable nginx >> /tmp/._cloud_init.log 2>&1
          systemctl start nginx >> /tmp/._cloud_init.log 2>&1
          echo "nginx installed" >> /tmp/._cloud_init.log

          echo "init complete" >> /tmp/._cloud_init.log

Conditions:
  IsPublicCondition: !Equals [!Ref IsPublic, "true"]

Mappings:
  RegionMap:
    us-east-1:
      UseAMID: ami-0c421724a94bba6d6

Outputs:
  InstancePublicIP:
    Description: Public IP of the EC2 instance
    Value: !GetAtt Instance.PublicIp
    Condition: IsPublicCondition

  InstancePrivateIP:
    Description: Private IP of the EC2 instance
    Value: !GetAtt Instance.PrivateIp
