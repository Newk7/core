# SOC Agent worker — scheduler + LangGraph orchestration + SQS consumer

services:
  soc-worker:
    build:
      context: ../../
      dockerfile: stack/soc-worker/Dockerfile
    container_name: soc-worker
    hostname: soc-worker
    restart: unless-stopped
    environment:
      - ENV_NAME=${ENV_NAME:-prod}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - TASK_BUCKET=${TASK_BUCKET:-biz-tool-prod-task-data-381492049589}
      # SOC database
      - SOC_DATABASE_URL=${SOC_DATABASE_URL}
      # Anthropic (for LangGraph agents)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Azure Sentinel
      - SENTINEL_TENANT_ID=${SENTINEL_TENANT_ID:-}
      - SENTINEL_CLIENT_ID=${SENTINEL_CLIENT_ID:-}
      - SENTINEL_CLIENT_SECRET=${SENTINEL_CLIENT_SECRET:-}
      - SENTINEL_WORKSPACE_ID=${SENTINEL_WORKSPACE_ID:-}
      - SENTINEL_SUBSCRIPTION_ID=${SENTINEL_SUBSCRIPTION_ID:-}
      - SENTINEL_RESOURCE_GROUP=${SENTINEL_RESOURCE_GROUP:-}
      - SENTINEL_WORKSPACE_NAME=${SENTINEL_WORKSPACE_NAME:-}
      # Wiz
      - WIZ_CLIENT_ID=${WIZ_CLIENT_ID:-}
      - WIZ_CLIENT_SECRET=${WIZ_CLIENT_SECRET:-}
      # Qualys
      - QUALYS_USERNAME=${QUALYS_USERNAME:-}
      - QUALYS_PASSWORD=${QUALYS_PASSWORD:-}
      - QUALYS_API_URL=${QUALYS_API_URL:-https://qualysapi.qualys.com}
      # Snyk
      - SNYK_API_TOKEN=${SNYK_API_TOKEN:-}
      - SNYK_ORG_ID=${SNYK_ORG_ID:-}
      # Notifications
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY:-}
      # LangSmith (optional)
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-soc-agent}
    networks:
      - core-net
    extra_hosts:
      - host.docker.internal:host-gateway

networks:
  core-net:
    external: true
