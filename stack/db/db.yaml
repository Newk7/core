# Postgres task database - docker-compose config for running on the EC2 host
# This is NOT a CloudFormation template - it runs directly on the build host

services:
  postgres:
    image: postgres:16-alpine
    container_name: biz-tool-postgres
    hostname: biz-tool-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-biztool}
      - POSTGRES_USER=${POSTGRES_USER:-biztool}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SOC_DB_USER=${SOC_DB_USER:-socagent}
      - SOC_DB_PASSWORD=${SOC_DB_PASSWORD}
      - MM_DB_USER=${MM_DB_USER:-mattermost}
      - MM_DB_PASSWORD=${MM_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - core-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biztool} -d ${POSTGRES_DB:-biztool}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local

networks:
  core-net:
    external: true
