# git.districtsolutions.ai - Gitea self-hosted git server
# protected with basic auth

server {
    listen 443 ssl;
    server_name git.districtsolutions.ai;

    ssl_certificate     /etc/letsencrypt/live/districtsolutions.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/districtsolutions.ai/privkey.pem;

    # basic auth
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/htpasswd;

    client_max_body_size 1G;

    location / {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://gitea:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # websocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # health endpoint - no auth
    location /api/v1/version {
        auth_basic off;
        proxy_pass http://gitea:8080/api/v1/version;
    }

    access_log /var/log/nginx/git.districtsolutions.ai_access.log main;
    error_log  /var/log/nginx/git.districtsolutions.ai_error.log warn;
}
