# kb.districtsolutions.ai - Open WebUI (knowledge base / AI chat)
# no nginx basic auth - OWU uses JWT Authorization header internally
# gzip disabled - breaks Server-Sent Events for streaming chat

server {
    listen 443 ssl;
    server_name kb.districtsolutions.ai;

    ssl_certificate     /etc/nginx/ssl/districtsolutions.ai.crt;
    ssl_certificate_key /etc/nginx/ssl/districtsolutions.ai.key;

    # disable gzip for SSE streaming
    gzip off;

    client_max_body_size 50m;

    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://biz-tool-oweb:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    access_log /var/log/nginx/kb.districtsolutions.ai_access.log main;
    error_log  /var/log/nginx/kb.districtsolutions.ai_error.log warn;
}
