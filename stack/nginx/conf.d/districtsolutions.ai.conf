# districtsolutions.ai - company landing page SPA
# served by district-web container on core-net

server {
    listen 443 ssl;
    server_name districtsolutions.ai www.districtsolutions.ai;

    ssl_certificate     /etc/letsencrypt/live/districtsolutions.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/districtsolutions.ai/privkey.pem;

    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://district-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # cache static assets (proxied)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://district-web:80;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/districtsolutions.ai_access.log main;
    error_log  /var/log/nginx/districtsolutions.ai_error.log warn;
}
