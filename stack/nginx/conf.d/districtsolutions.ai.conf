# districtsolutions.ai - company landing page SPA
# public (no auth) - static files served from /var/www/html

server {
    listen 443 ssl;
    server_name districtsolutions.ai;

    ssl_certificate     /etc/nginx/ssl/districtsolutions.ai.crt;
    ssl_certificate_key /etc/nginx/ssl/districtsolutions.ai.key;

    root /var/www/html;
    index index.html;

    # SPA: fall back to index.html for client-side routing
    location / {
        limit_req zone=general burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/districtsolutions.ai_access.log main;
    error_log  /var/log/nginx/districtsolutions.ai_error.log warn;
}
