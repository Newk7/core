# api.districtsolutions.ai - BizTool Core API (FastAPI)
# protected with basic auth until go-live

server {
    listen 443 ssl;
    server_name api.districtsolutions.ai;

    ssl_certificate     /etc/nginx/ssl/districtsolutions.ai.crt;
    ssl_certificate_key /etc/nginx/ssl/districtsolutions.ai.key;

    # basic auth - remove when ready to go live
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/htpasswd;

    client_max_body_size 100m;

    location / {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://biz-tool-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # health endpoint - no auth required
    location /health {
        auth_basic off;
        proxy_pass http://biz-tool-api:8000/health;
    }

    # contact form - public (called from districtsolutions.ai website)
    location /api/v1/contact {
        auth_basic off;
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://biz-tool-api:8000/api/v1/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/api.districtsolutions.ai_access.log main;
    error_log  /var/log/nginx/api.districtsolutions.ai_error.log warn;
}
