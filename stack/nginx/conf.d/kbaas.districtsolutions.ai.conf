# kbaas.districtsolutions.ai - Open WebUI (knowledge base as a service)
# No basic auth — OpenWebUI has its own JWT authentication.
# gzip disabled for SSE streaming.

server {
    listen 443 ssl;
    server_name kbaas.districtsolutions.ai;

    ssl_certificate     /etc/letsencrypt/live/districtsolutions.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/districtsolutions.ai/privkey.pem;

    gzip off;
    client_max_body_size 50m;

    # resolve upstream at request time so nginx starts even if oweb is down
    resolver 127.0.0.11 valid=30s;
    set $oweb_upstream biz-tool-oweb:8080;

    # static assets — no rate limit (SvelteKit loads many JS chunks at once)
    location /_app/immutable/ {
        proxy_pass http://$oweb_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://$oweb_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /health {
        proxy_pass http://$oweb_upstream/health;
    }

    access_log /var/log/nginx/kbaas.districtsolutions.ai_access.log main;
    error_log  /var/log/nginx/kbaas.districtsolutions.ai_error.log warn;
}
