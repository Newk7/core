# kbaas.districtsolutions.ai - Open WebUI (knowledge base as a service)
# basic auth layer + gzip disabled for SSE streaming

server {
    listen 443 ssl;
    server_name kbaas.districtsolutions.ai;

    ssl_certificate     /etc/letsencrypt/live/districtsolutions.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/districtsolutions.ai/privkey.pem;

    # basic auth
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/htpasswd;

    # disable gzip for SSE streaming
    gzip off;

    client_max_body_size 50m;

    # resolve upstream at request time so nginx starts even if oweb is down
    resolver 127.0.0.11 valid=30s;
    set $oweb_upstream http://biz-tool-oweb:8080;

    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass $oweb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # health endpoint - no auth required
    location /health {
        auth_basic off;
        proxy_pass $oweb_upstream/health;
    }

    access_log /var/log/nginx/kbaas.districtsolutions.ai_access.log main;
    error_log  /var/log/nginx/kbaas.districtsolutions.ai_error.log warn;
}
