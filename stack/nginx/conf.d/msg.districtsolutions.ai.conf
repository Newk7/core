# msg.districtsolutions.ai - Mattermost team messaging
# Protected with nginx basic auth layer, then Mattermost's own auth behind it.

server {
    listen 443 ssl;
    server_name msg.districtsolutions.ai;

    ssl_certificate     /etc/letsencrypt/live/districtsolutions.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/districtsolutions.ai/privkey.pem;

    # basic auth
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/htpasswd;

    client_max_body_size 50m;

    # resolve upstream at request time so nginx starts even if mattermost is down
    resolver 127.0.0.11 valid=30s;
    set $mm_upstream core-mattermost:8065;

    # websocket endpoint — Mattermost realtime
    location ~ /api/v[0-9]+/(users/)?websocket$ {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://$mm_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frame-Options SAMEORIGIN;

        # websocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # everything else
    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://$mm_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frame-Options SAMEORIGIN;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    access_log /var/log/nginx/msg.districtsolutions.ai_access.log main;
    error_log  /var/log/nginx/msg.districtsolutions.ai_error.log warn;
}
