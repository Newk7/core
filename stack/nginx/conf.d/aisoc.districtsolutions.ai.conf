# aisoc.districtsolutions.ai - AI SOC platform
# basic auth layer - frontend at / proxied to soc-web, API at /api/v1/soc/ proxied to core API

server {
    listen 443 ssl;
    server_name aisoc.districtsolutions.ai;

    ssl_certificate     /etc/letsencrypt/live/districtsolutions.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/districtsolutions.ai/privkey.pem;

    # basic auth
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/htpasswd;

    client_max_body_size 50m;

    # resolve upstreams at request time so nginx starts even if backends are down
    resolver 127.0.0.11 valid=30s;
    set $api_upstream http://biz-tool-api:8000;
    set $socweb_upstream http://soc-web:3000;

    # API routes — proxied to core API (which has SOC routes mounted)
    location /api/v1/soc/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass $api_upstream/api/v1/soc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # health endpoint - no auth required
    location /health {
        auth_basic off;
        proxy_pass $api_upstream/health;
    }

    # Next.js frontend — static assets with long cache
    location /_next/static/ {
        proxy_pass $socweb_upstream/_next/static/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js frontend — everything else
    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass $socweb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /var/log/nginx/aisoc.districtsolutions.ai_access.log main;
    error_log  /var/log/nginx/aisoc.districtsolutions.ai_error.log warn;
}
