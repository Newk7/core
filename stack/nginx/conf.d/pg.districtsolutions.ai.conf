# pg.districtsolutions.ai - pgAdmin4 web UI
# double-locked: nginx basic auth + pgAdmin's own login
# proxied to pg-admin container on core-net

server {
    listen 443 ssl;
    server_name pg.districtsolutions.ai;

    ssl_certificate     /etc/letsencrypt/live/districtsolutions.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/districtsolutions.ai/privkey.pem;

    # outer nginx basic auth layer
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/htpasswd;

    # pgAdmin sends large cookies; bump header buffer
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    location / {
        proxy_pass http://pg-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    access_log /var/log/nginx/pg.districtsolutions.ai_access.log main;
    error_log  /var/log/nginx/pg.districtsolutions.ai_error.log warn;
}
