# Nginx reverse proxy for districtsolutions.ai
# Uses purchased SSL cert (not Let's Encrypt)
# Cert files must be placed in data/ssl/ before starting

services:
  nginx:
    image: nginx:alpine
    container_name: core-nginx
    hostname: core-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
      - ./html:/var/www/html:ro
      - ../../data/ssl:/etc/nginx/ssl:ro
      - ../../data/nginx/logs:/var/log/nginx
    networks:
      - core-net

networks:
  core-net:
    external: true
