# Nginx reverse proxy for districtsolutions.ai
# Uses Let's Encrypt certs issued by certbot (HTTP-01 challenge)
# Issue certs first: ./scripts/issue-cert.sh

services:
  nginx:
    image: nginx:alpine
    container_name: core-nginx
    hostname: core-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
      - ./html:/var/www/html:ro
      - ../../data/letsencrypt:/etc/letsencrypt:ro
      - ../../data/certbot-webroot:/var/www/certbot:ro
      - ../../data/nginx/logs:/var/log/nginx
    networks:
      - core-net

networks:
  core-net:
    external: true
