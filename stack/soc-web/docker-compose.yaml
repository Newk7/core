# SOC Agent frontend — Next.js dashboard at aisoc.districtsolutions.ai

services:
  soc-web:
    image: ${ECR_REGISTRY:-381492049589.dkr.ecr.us-east-1.amazonaws.com}/core/${ENV_NAME:-prod}/soc-web:${IMAGE_TAG:-latest}
    build:
      context: ${SOC_WEB_DIR:-/opt/ds/ai-soc/soc-agent/web}
      dockerfile: ${CORE_DIR:-/opt/ds/core}/stack/soc-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: soc-web
    hostname: soc-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - core-net

networks:
  core-net:
    external: true
