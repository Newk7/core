[project]
name = "core"
version = "0.1.0"
description = "BizTool Core - task pipeline, document processing, and REST API"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]

dependencies = [
    "boto3",
    "docling",
    "fastapi",
    "fastparquet",
    "huggingface_hub",
    "pandas",
    "pillow",
    "psycopg2-binary",
    "pydantic",
    "pytesseract",
    "python-multipart",
    "requests",
    "ujson",
    "uvicorn",
]

[project.optional-dependencies]
soc = [
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.3.0",
    "langgraph-supervisor>=0.0.10",
    "sqlalchemy>=2.0.0",
    "apscheduler>=3.10.0",
    "langsmith>=0.1.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools", "wheel"]

[tool.setuptools.packages.find]
include = ["core*"]
